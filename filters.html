<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SyncMates | Filters</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Set Your Filters</h1>
  <form id="filter-form">
    <label>Age Range:</label>
    <input type="number" placeholder="Min Age" />
    <input type="number" placeholder="Max Age" />
    <label>Interests:</label>
    <input type="text" placeholder="e.g. Music, Sports" />
    <label>Location:</label>
    <input type="text" placeholder="City or Zip" />
    <button type="submit">Apply Filters</button>
  </form>
</body>
</html>
